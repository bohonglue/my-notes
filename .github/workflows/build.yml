name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 只印出長度和雜湊的前幾碼，用來判斷 secret 有沒有貼完整，不會洩漏金鑰內容。
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "沒有設定簽章金鑰，改用 debug 金鑰"; exit 0; fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d -i > "$RUNNER_TEMP/k.jks" || echo "base64 解碼失敗"
          echo "金鑰檔大小：$(stat -c %s "$RUNNER_TEMP/k.jks") bytes（正確應為 2570）"
          echo "金鑰檔雜湊：$(sha256sum "$RUNNER_TEMP/k.jks" | cut -c1-16)（正確應為 dcdbd4baffde8168）"
          echo "密碼長度：${#ANDROID_KEYSTORE_PASSWORD}（正確應為 24）"
          keytool -list -keystore "$RUNNER_TEMP/k.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | grep -E "mynotes|error|incorrect" || true
          rm -f "$RUNNER_TEMP/k.jks"
      - run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/Release/

  # 合併到 main 時，把安裝檔發佈到公開的 my-notes-releases（只有安裝檔，沒有程式碼），
  # app 裡的「檢查更新」會讀那裡的最新版本。需要 secret RELEASES_TOKEN。
  release:
    needs: [android, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: 1.0.${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "沒有設定 RELEASES_TOKEN，略過發佈"; exit 0; fi
          cp dist/android-apk/app-release.apk "my-notes-$VERSION.apk"
          (cd dist/windows-app && zip -qr "../../my-notes-windows-$VERSION.zip" .)
          gh release create "v$VERSION" \
            --repo "${{ github.repository_owner }}/my-notes-releases" \
            --title "我的筆記 $VERSION" \
            --notes "$NOTES" \
            "my-notes-$VERSION.apk" "my-notes-windows-$VERSION.zip"
